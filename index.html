<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chill Local Music Player</title>
  <style>
    :root {
      --bg: #12131c;
      --card: #1c1e2b;
      --card-hover: #26293c;
      --accent: #7c4dff;
      --accent-glow: rgba(124, 77, 255, 0.4);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
    }

    @media (max-width: 768px) {
      .player-container {
        grid-template-columns: 1fr;
      }
    }

    .visualizer-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #181a26, #0e1017);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-info h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .canvas-wrap {
      width: 100%;
      height: 180px;
      margin: 18px 0;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slider-group {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .playlist-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .playlist-header h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .add-file-label {
      background: var(--accent);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }

    #fileInput {
      display: none;
    }

    .playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .playlist li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      cursor: grab;
      transition: background 0.15s;
    }

    .playlist li:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .playlist li.playing {
      border-color: var(--accent);
      background: rgba(124, 77, 255, 0.15);
    }

    .playlist li.dragging {
      opacity: 0.4;
    }

    .song-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .song-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      padding: 4px 6px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
    }

    .icon-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="visualizer-section">
      <div class="header-info">
        <h2 id="nowPlayingTitle">No Track Loaded</h2>
        <p id="nowPlayingSub">Add or select local songs</p>
      </div>

      <div class="canvas-wrap">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls-panel">
        <div class="slider-group">
          <div class="slider-label">
            <span>Bass Boost (Low Shelf)</span>
            <span id="bassValue">0 dB</span>
          </div>
          <input type="range" id="bassSlider" min="0" max="18" value="0" step="1" />
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Speed / Tempo</span>
            <span id="speedValue">1.0x</span>
          </div>
          <input type="range" id="speedSlider" min="0.5" max="2.0" value="1.0" step="0.05" />
        </div>

        <div class="btn-row">
          <button id="playPauseBtn">Play</button>
          <button id="shuffleBtn">Shuffle: Off</button>
          <button id="randomBtn">Play Random</button>
        </div>
      </div>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <h3>Queue & Songs</h3>
        <label class="add-file-label" for="fileInput">+ Add Songs</label>
        <input type="file" id="fileInput" accept="audio/*" multiple />
      </div>

      <ul class="playlist" id="playlist"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
