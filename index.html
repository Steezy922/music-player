<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chill Local Music Player</title>
  <style>
    :root {
      --bg: #12131c;
      --card: #1c1e2b;
      --card-hover: #26293c;
      --accent: #7c4dff;
      --accent-glow: rgba(124, 77, 255, 0.4);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
    }

    @media (max-width: 780px) {
      .player-container {
        grid-template-columns: 1fr;
      }
    }

    .visualizer-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #181a26, #0e1017);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .header-info {
      min-width: 0;
      flex: 1;
    }

    .header-info h2 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .viz-select {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
    }
    .viz-select option {
      background: #1c1e2b;
      color: var(--text);
    }

    .canvas-wrap {
      width: 100%;
      height: 165px;
      margin: 14px 0;
      background: #10121a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .seek-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .slider-group {
      background: rgba(255, 255, 255, 0.03);
      padding: 9px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-group.full-width {
      grid-column: span 2;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mini-link {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0;
      font-size: 0.72rem;
      cursor: pointer;
      text-transform: none;
    }

    .mini-link:hover {
      background: none;
      box-shadow: none;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 5px;
    }

    .transport-row, .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    button {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.82rem;
      transition: all 0.2s ease;
      flex: 1;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .playlist-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .playlist-header h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .add-file-label {
      background: var(--accent);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }

    .clear-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      flex: none;
    }

    .clear-btn:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: none;
    }

    #fileInput {
      display: none;
    }

    .playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .playlist li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      cursor: grab;
      transition: background 0.15s;
    }
    .playlist li:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .playlist li.playing {
      border-color: var(--accent);
      background: rgba(124, 77, 255, 0.15);
    }

    .playlist li.dragging {
      opacity: 0.4;
    }

    .song-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      padding: 4px 6px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      flex: none;
    }

    .icon-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="visualizer-section">
      <div class="top-bar">
        <div class="header-info">
          <h2 id="nowPlayingTitle">No Track Loaded</h2>
          <p id="nowPlayingSub">Click "+ Add Songs" to load local audio</p>
        </div>

        <select id="vizModeSelect" class="viz-select" title="Visualizer Style">
          <option value="bars">Visualizer: Bars</option>
          <option value="mirror">Visualizer: Mirror</option>
          <option value="wave">Visualizer: Oscilloscope</option>
          <option value="spectrogram">Visualizer: Spectrogram</option>
        </select>
      </div>

      <div class="canvas-wrap">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls-panel">
        <div class="seek-group">
          <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05" />
          <div class="time-labels">
            <span id="currentTime">0:00</span>
            <span id="totalDuration">0:00</span>
          </div>
        </div>

        <div class="slider-grid">
          <div class="slider-group">
            <div class="slider-label">
              <span>Bass Boost</span>
              <span id="bassValue">0 dB</span>
            </div>
            <input type="range" id="bassSlider" min="0" max="20" value="0" step="1" />
          </div>

          <div class="slider-group">
            <div class="slider-label">
              <span>Pitch / Speed <button class="mini-link" id="resetSpeedBtn">(Reset)</button></span>
              <span id="speedValue">1.00x</span>
            </div>
            <input type="range" id="speedSlider" min="0.5" max="1.75" value="1.0" step="0.05" />
          </div>

          <div class="slider-group full-width">
            <div class="slider-label">
              <span>Volume <button class="mini-link" id="muteBtn">(Mute)</button></span>
              <span id="volumeValue">80%</span>
            </div>
            <input type="range" id="volumeSlider" min="0" max="1" value="0.8" step="0.01" />
          </div>
        </div>

        <div class="transport-row">
          <button id="prevBtn">⏮ Prev</button>
          <button id="playPauseBtn">Play</button>
          <button id="nextBtn">Next ⏭</button>
        </div>

        <div class="mode-row">
          <button id="shuffleBtn">Shuffle: Off</button>
          <button id="loopBtn">Loop: All</button>
          <button id="randomBtn">Play Random</button>
        </div>
      </div>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <h3>Queue & Songs</h3>
        <div class="header-btns">
          <label class="add-file-label" for="fileInput">+ Add Songs</label>
          <button class="clear-btn" id="clearAllBtn" title="Remove all songs">Clear</button>
        </div>
        <input type="file" id="fileInput" accept="audio/*" multiple />
      </div>

      <ul class="playlist" id="playlist"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
